name: Notify IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "src/**"
      - "public/**"
      - "package.json"
      - "sitemap.xml"

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Notify IndexNow of updated pages
        env:
          INDEXNOW_KEY: c20f33d1b5d8be130e6fc6cd768b0bac
        run: |
          sleep 60
          urls=(
            "https://mulch-calculator-5xl.pages.dev/"
            "https://mulch-calculator-5xl.pages.dev/mulch-calculator-cubic-yards"
            "https://mulch-calculator-5xl.pages.dev/how-much-mulch-do-i-need"
            "https://mulch-calculator-5xl.pages.dev/how-many-bags-of-mulch-do-i-need"
            "https://mulch-calculator-5xl.pages.dev/how-deep-should-mulch-be"
          )
          for url in "${urls[@]}"; do
            code=$(curl -sS -G -o /dev/null -w "%{http_code}" \
              "https://api.indexnow.org/indexnow" \
              --data-urlencode "url=$url" \
              --data-urlencode "key=$INDEXNOW_KEY")
            echo "$code $url"
          done
